  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <script>
      /* Self-repair: an old copy of this page can point to app files that a newer publish removed.
         If the app files fail to load, or the app has not started after 9 s, reload once with a fresh copy. */
      (function () {
        var KEY = 'ck-repair-at';
        function fresh() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 60000) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('_r', String(Date.now()));
          location.replace(u.toString());
          return true;
        }
        function giveUp() {
          var r = document.getElementById('root');
          if (r && !r.firstChild)
            r.innerHTML = '<div style="font-family:Mukta,sans-serif;max-width:420px;margin:60px auto;padding:24px;text-align:center;color:#10233F">' +
              '<p style="font-size:24px;font-weight:700;margin:0 0 16px">पान नीट उघडले नाही.</p>' +
              '<button onclick="location.reload()" style="font-size:22px;font-weight:700;padding:14px 28px;border-radius:16px;border:3px solid #10233F;background:#F39200">पुन्हा उघडा</button></div>';
        }
        window.__ckRepair = function () { if (!fresh()) giveUp(); };
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) window.__ckRepair();
        }, true);
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); window.__ckRepair(); });
        setTimeout(function () { var r = document.getElementById('root'); if (r && !r.firstChild) window.__ckRepair(); }, 9000);
      })();
    </script>
